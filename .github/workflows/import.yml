name: Import SnoreGuard v0.3.0 sources
on:
  push:
    paths:
      - '.github/workflows/import.yml'
      - 'bootstrap/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Expand and publish source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part*.b64 > /tmp/snoreguard.b64
          base64 --decode /tmp/snoreguard.b64 > /tmp/snoreguard.tar.xz
          echo '4852d8dc7e409ab7bdc24146e81f59557f32602b0bfa68aa7e20498d990e0a81  /tmp/snoreguard.tar.xz' | sha256sum --check
          tar -xJf /tmp/snoreguard.tar.xz -C .
          rm -rf bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Release v0.3.0: strong GT2 alert burst and local snore monitor'
            git push origin HEAD:main
          fi
          if ! git rev-parse -q --verify refs/tags/v0.3.0 >/dev/null; then
            git tag v0.3.0
            git push origin v0.3.0
          fi
