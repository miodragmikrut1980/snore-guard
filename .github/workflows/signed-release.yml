name: Signed SnoreGuard release APK

# Run manually only after a long-lived private signing key is securely configured.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER" || { echo "Missing Android command line tools"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Check private signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.SNOREGUARD_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SNOREGUARD_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SNOREGUARD_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SNOREGUARD_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ secrets.SNOREGUARD_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" &&
            test -n "$KEY_PASSWORD" && test -n "$EXPECTED_CERT" ||
            { echo "Signing secrets are not configured. See docs/RELEASE_SIGNING.md"; exit 1; }
      - name: Decode keystore in temporary runner storage
        env:
          KEYSTORE_B64: ${{ secrets.SNOREGUARD_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/snoreguard-release.jks"
          test -s "$RUNNER_TEMP/snoreguard-release.jks"
          chmod 600 "$RUNNER_TEMP/snoreguard-release.jks"
      - name: Run tests and assemble signed release
        env:
          SNOREGUARD_SIGNING_STORE_FILE: ${{ runner.temp }}/snoreguard-release.jks
          SNOREGUARD_SIGNING_STORE_PASSWORD: ${{ secrets.SNOREGUARD_RELEASE_STORE_PASSWORD }}
          SNOREGUARD_SIGNING_KEY_ALIAS: ${{ secrets.SNOREGUARD_RELEASE_KEY_ALIAS }}
          SNOREGUARD_SIGNING_KEY_PASSWORD: ${{ secrets.SNOREGUARD_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Verify release signature and expected certificate
        env:
          EXPECTED_CERT: ${{ secrets.SNOREGUARD_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk \
            > "$RUNNER_TEMP/apk-verify.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-verify.txt" |
            head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_CERT" | tr -d ':[:space:]' |
            tr '[:upper:]' '[:lower:]')"
          test -n "$actual" && test "$actual" = "$expected" ||
            { echo "Signing certificate does not match the expected long-lived certificate"; exit 1; }
          echo "Release APK signature and expected certificate verified."
      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SnoreGuard-v0.7.1-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/snoreguard-release.jks"
